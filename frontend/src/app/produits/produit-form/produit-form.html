<div class="page">
  <a class="back-link" routerLink="/produits">&larr; Retour à la liste</a>
  <h1>{{ isEditMode() ? 'Modifier le produit' : 'Nouveau produit' }}</h1>

  <form class="form-card" [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Référence
      <input type="text" formControlName="reference" />
    </label>

    <label>
      Nom
      <input type="text" formControlName="nom" />
    </label>

    <label>
      Catégorie
      <input type="text" formControlName="categorie" />
    </label>

    <div class="row">
      <label>
        Quantité
        <input type="number" formControlName="quantite" min="0" />
      </label>

      <label>
        Seuil d'alerte
        <input type="number" formControlName="seuilAlerte" min="0" />
      </label>
    </div>

    <label>
      Prix unitaire (€)
      <input type="number" formControlName="prixUnitaire" min="0" step="0.01" />
    </label>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="saving()">
      {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
    </button>
  </form>
</div>
