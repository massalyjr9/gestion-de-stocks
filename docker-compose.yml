services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestionstocks
      POSTGRES_USER: gestionstocks
      POSTGRES_PASSWORD: gestionstocks
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestionstocks"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: gestionstocks
      DB_USER: gestionstocks
      DB_PASSWORD: gestionstocks
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  db-data:
